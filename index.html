<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>我的课表</title>
<style>
:root{
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f5f6fa; --card:#fff; --ink:#14161c; --soft:#6f7480; --faint:#9aa0ad;
  --line:#e7e9f0; --accent:#5856d6;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",sans-serif;overscroll-behavior:none;}
body{max-width:640px;margin:0 auto;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;user-select:none;font-weight:600;}
.app{padding-top:var(--safe-top);padding-bottom:40px;}

/* 顶部：紧凑周选择 */
.topbar{position:sticky;top:0;z-index:20;background:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#5856d6,#9b51e0);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;flex:none;}
.wk{flex:1;min-width:0;}
.wk-title{font-size:19px;font-weight:800;display:flex;align-items:center;gap:5px;cursor:pointer;}
.wk-title .caret{font-size:12px;color:#9aa0ad;}
.wk-sub{font-size:10.5px;color:var(--soft);margin-top:1px;font-weight:600;}
.navs{display:flex;gap:6px;flex:none;}
.navbtn{width:34px;height:34px;border-radius:10px;background:#f2f3f8;color:#454b59;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;}
.navbtn:active{background:#e6e8f2;}
.navbtn.today{font-size:13px;background:rgba(88,86,214,.12);color:var(--accent);}
.chipnow{font-size:9.5px;color:#fff;background:var(--accent);border-radius:6px;padding:1px 5px;margin-left:2px;font-weight:700;}

/* 课表 */
.pager{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.pager::-webkit-scrollbar{display:none;}
.pager .track{display:flex;align-items:flex-start;}
.page{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;padding:0 6px 6px;}
.grid{display:grid;grid-template-columns:16px 46px repeat(7,1fr);grid-template-rows:40px 64px 64px 64px 64px 72px 64px 64px 64px 72px 64px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 18px rgba(20,22,28,.07);}
.ghead{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--faint);font-weight:700;border-bottom:1px solid var(--line);}
.ghead .lnum{display:inline-flex;min-width:23px;height:23px;border-radius:50%;align-items:center;justify-content:center;font-size:13.5px;font-weight:800;margin-top:1px;color:var(--ink);}
.ghead.today{color:var(--accent);}
.ghead.today .lnum{background:var(--accent);color:#fff;}
.sectband{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;writing-mode:vertical-rl;letter-spacing:2px;}
.sectband.am{background:#eef0ff;color:#5b5bd6;}
.sectband.pm{background:#e8f7f4;color:#12a08f;}
.sectband.ev{background:#f4edff;color:#8b5cf6;}
.timecell{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 1px;background:#fcfcfe;border-right:1px solid var(--line);border-left:1px solid var(--line);border-bottom:1px solid var(--line);}
.timecell .pn{font-size:13px;font-weight:800;color:var(--ink);white-space:nowrap;line-height:1.1;}
.timecell .pt{font-size:8.5px;font-weight:700;color:var(--faint);margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.timecell.sep{border-top:3px solid #dfe3f0;}
.course{position:relative;border-radius:12px;padding:6px 3px;margin:2px 1.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;background:#fff;border:1.5px solid var(--bd);overflow:hidden;}
.course:active{transform:scale(.96);}
.course .cname{font-size:11px;font-weight:800;line-height:1.2;color:var(--ink);word-break:break-all;}
.course .croom{font-size:8.5px;font-weight:700;line-height:1.25;margin-top:4px;color:var(--soft);word-break:break-all;}
.course .ctype{position:absolute;top:3px;right:3px;width:13px;height:13px;border-radius:4px;background:var(--acc);color:#fff;font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.bg-none{display:flex;justify-content:center;padding-top:10px;color:#e3e6ef;font-size:16px;font-weight:800;}
.noweek{grid-column:3 / 10;grid-row:2 / 12;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--faint);gap:8px;}
.noweek .big{font-size:32px;}
.noweek .txt{font-size:13px;font-weight:700;}

.mask{position:fixed;inset:0;background:rgba(15,17,26,.34);z-index:40;opacity:0;pointer-events:none;transition:opacity .22s;}
.mask.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:#fff;z-index:50;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.2);transform:translateY(115%);transition:transform .28s cubic-bezier(.32,.72,.24,1);padding:8px 20px calc(var(--safe-bottom) + 18px);}
.sheet.show{transform:translateY(0);}
.grab{width:40px;height:4px;border-radius:99px;background:#e2e4ec;margin:8px auto 14px;}
.s-title{font-size:21px;font-weight:800;line-height:1.35;padding-right:34px;}
.s-close{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;background:#f1f2f6;color:#7c818e;display:flex;align-items:center;justify-content:center;font-size:15px;}
.s-weeks{display:inline-flex;margin-top:12px;font-size:13px;font-weight:800;color:var(--accent);background:rgba(88,86,214,.1);border-radius:8px;padding:5px 10px;}
.s-timerow{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap;}
.tchip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;color:#fff;border-radius:9px;padding:6px 11px;}
.tchip.soft{background:#f2f3f7;color:#3f4450;font-weight:700;}
.s-rows{margin-top:12px;background:#f7f8fb;border-radius:14px;padding:13px 15px;}
.s-row{display:flex;align-items:flex-start;font-size:14px;line-height:1.6;font-weight:700;}
.s-row .k{width:54px;flex:none;color:var(--faint);font-size:13px;font-weight:600;padding-top:1px;}
.s-row .v{flex:1;color:var(--ink);}
.wk-title2{font-size:17px;font-weight:800;text-align:center;padding:0 30px;}
.wk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;max-height:54vh;overflow:auto;padding-bottom:6px;}
.wk-item{border:1.5px solid var(--line);border-radius:12px;padding:11px 6px;text-align:center;}
.wk-item .wno{font-size:15px;font-weight:800;}
.wk-item .wdate{font-size:10.5px;color:var(--soft);margin-top:3px;font-weight:600;}
.wk-item.active{border-color:var(--accent);background:rgba(88,86,214,.08);color:var(--accent);}
.wk-item.now{position:relative;}
.wk-item.now::after{content:"本周";position:absolute;top:5px;right:6px;font-size:9px;background:var(--accent);color:#fff;border-radius:4px;padding:1px 5px;font-weight:700;}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:12px 8px 2px;font-size:11.5px;font-weight:700;color:#8a8f9a;justify-content:center;}
</style>
</head>

function accFor(n){if(COLORS[n])return COLORS[n];let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return ['#5856d6','#2f8de0','#12a08f','#e08a1e','#e0486f','#7a5cd8'][h%6];}
function shortRoom(r){return String(r).replace(/[（(][^）)]*[）)]/g,'');}
function splitName(n){const m=n.match(/^(.+?)([★●◆◇○])$/);return m?{title:m[1],type:m[2]}:{title:n,type:''};}
function el(t,c,txt,st){const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;if(st)for(const k in st)e.style[k]=st[k];return e;}
const wc={};
function weeksSet(s){if(wc[s])return wc[s];const set=new Set();if(!s)return set;String(s).split(',').forEach(t=>{t=t.trim();if(!t)return;const i=t.indexOf('-');if(i>=0){const a=+t.slice(0,i),b=+t.slice(i+1);for(let x=a;x<=b;x++)set.add(x);}else set.add(+t);});wc[s]=set;return set;}
function active(s,w){return weeksSet(s.weeks).has(w);}
function fmtWeeks(s){if(!s)return '全部周';return '第'+s.replace(/,/g,'、')+'周';}
function currentWeek(){const n=new Date();const d=new Date(n.getFullYear(),n.getMonth(),n.getDate());let w=Math.floor((d-SEM_START)/6048e5)+1;if(w<1)w=1;if(w>TOTAL_WEEKS)w=TOTAL_WEEKS;return w;}
function weekStart(w){return new Date(SEM_START.getTime()+(w-1)*6048e5);}
function today(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
let curWeek=currentWeek(),selWeek=curWeek;
function coursesForWeek(w){const r=[[],[],[],[],[],[],[]];SCHEDULE.forEach(s=>{if(active(s,w))r[s.day].push(s);});r.forEach(a=>a.sort((x,y)=>x.p1-y.p1||x.p2-y.p2));return r;}

function buildWeekPage(w){
  const page=el('div','page');
  const byDay=coursesForWeek(w);
  const grid=el('div','grid');
  const start=weekStart(w);
  grid.appendChild(el('div','ghead','',{gridColumn:'1 / 3'}));
  for(let d=0;d<7;d++){
    const dd=new Date(start.getTime()+d*864e5);
    const h=el('div','ghead');h.style.gridColumn=(d+3)+' / '+(d+4);
    const isT=dd.getTime()===today().getTime();if(isT)h.classList.add('today');
    h.innerHTML='<span>'+DAY_NAMES[d]+'</span><span class="lnum">'+dd.getDate()+'</span>';
    grid.appendChild(h);
  }
  SECTIONS.forEach(sec=>{
    grid.appendChild(el('div','sectband '+sec.cls,sec.name,{gridColumn:'1',gridRow:(sec.start+1)+' / '+(sec.end+3)}));
  });
  for(let p=1;p<=10;p++){
    const tc=el('div','timecell'+(p===1||p===5||p===9?' sep':''));tc.style.gridColumn='2';tc.style.gridRow=(p+1)+' / '+(p+2);
    tc.innerHTML='<span class="pn">第'+p+'节</span><span class="pt">'+PERIODS[p-1].s+'-'+PERIODS[p-1].e+'</span>';
    grid.appendChild(tc);
  }
  let total=0;
  for(let d=0;d<7;d++){
    const list=byDay[d];
    if(list.length===0){grid.appendChild(el('div','bg-none','·',{gridColumn:(d+3)+' / '+(d+4),gridRow:'2 / 12'}));continue;}
    total+=list.length;
    const laneEnd=[];const placed=list.map(s=>{let li=0;while(true){if(laneEnd[li]===undefined||laneEnd[li]<s.p1){laneEnd[li]=s.p2;break;}li++;}return {s,lane:li};});
    const lanes=laneEnd.length;
    placed.forEach(o=>{
      const s=o.s;const acc=accFor(splitName(s.name).title);const {title,type}=splitName(s.name);
      const b=el('div','course');b.style.setProperty('--acc',acc);b.style.setProperty('--bd',acc+'55');
      b.style.gridColumn=(d+3)+' / '+(d+4);b.style.gridRow=(s.p1+1)+' / '+(s.p2+2);
      if(lanes>1){b.style.height=(100/lanes)+'%';b.style.alignSelf='start';if(o.lane>0)b.style.marginTop=(o.lane*100/lanes)+'%';}
      b.innerHTML='<div class="cname">'+title+'</div>'+(s.room?'<div class="croom">'+shortRoom(s.room)+'</div>':'')+(type?'<div class="ctype">'+type+'</div>':'');
      b.onclick=()=>openSheet(s);
      grid.appendChild(b);
    });
  }
  if(total===0){const e=el('div','noweek');e.innerHTML='<div class="big">🌤</div><div class="txt">这一周没有课</div>';grid.appendChild(e);}
  page.appendChild(grid);return page;
}

function renderAll(){const t=document.getElementById('track');t.innerHTML='';for(let w=1;w<=TOTAL_WEEKS;w++)t.appendChild(buildWeekPage(w));updateTop();snapTo(selWeek,false);}
function updateTop(){
  document.getElementById('wkTitle').textContent='第 '+selWeek+' 周';
  document.getElementById('chipnow').style.display=(selWeek===curWeek)?'inline':'none';
  const st=weekStart(selWeek),en=new Date(st.getTime()+6*864e5);
  const byDay=coursesForWeek(selWeek);let c=0;const seen=new Set();
  byDay.forEach(l=>l.forEach(s=>{if(!seen.has(s.name)){seen.add(s.name);c++;}}));
  document.getElementById('wkSub').textContent=SEM_LABEL+' · '+(st.getMonth()+1)+'.'+st.getDate()+'—'+(en.getMonth()+1)+'.'+en.getDate()+' · '+c+'门课';
}
const pager=document.getElementById('pager');
function snapTo(w,anim){pager.scrollTo({left:(w-1)*pager.clientWidth,behavior:anim?'smooth':'instant'});}
let st2;pager.addEventListener('scroll',()=>{clearTimeout(st2);st2=setTimeout(()=>{const w=Math.round(pager.scrollLeft/pager.clientWidth)+1;if(w>=1&&w<=TOTAL_WEEKS&&w!==selWeek){selWeek=w;updateTop();}},90);},{passive:true});
document.getElementById('prevW').onclick=()=>{if(selWeek>1){selWeek--;updateTop();snapTo(selWeek,true);}};
document.getElementById('nextW').onclick=()=>{if(selWeek<TOTAL_WEEKS){selWeek++;updateTop();snapTo(selWeek,true);}};
document.getElementById('goToday').onclick=()=>{selWeek=curWeek;updateTop();snapTo(selWeek,true);};
document.getElementById('wkOpen').onclick=openPicker;
function openPicker(){const g=document.getElementById('wkGrid');g.innerHTML='';for(let w=1;w<=TOTAL_WEEKS;w++){const s=weekStart(w),e=new Date(s.getTime()+6*864e5);const it=el('div','wk-item');if(w===selWeek)it.classList.add('active');if(w===curWeek)it.classList.add('now');it.innerHTML='<div class="wno">第'+w+'周</div><div class="wdate">'+(s.getMonth()+1)+'月'+s.getDate()+'日-'+(e.getMonth()+1)+'月'+e.getDate()+'日</div>';it.onclick=()=>{selWeek=w;updateTop();snapTo(w,true);closePicker();};g.appendChild(it);}document.getElementById('picker').classList.add('show');document.getElementById('mask2').classList.add('show');}
function closePicker(){document.getElementById('picker').classList.remove('show');document.getElementById('mask2').classList.remove('show');}
function openSheet(s){const {title,type}=splitName(s.name);const acc=accFor(title);
 document.getElementById('sTitle').innerHTML=title+(type?'<span style="background:'+acc+';color:#fff;border-radius:7px;padding:2px 7px;font-size:12px;font-weight:800;margin-left:6px">'+type+'</span>':'');
 document.getElementById('sWeeks').textContent=fmtWeeks(s.weeks)+' · 共'+weeksSet(s.weeks).size+'周';
 const time=PERIODS[s.p1-1].s+' — '+PERIODS[s.p2-1].e;const tr=document.getElementById('sTimeout');tr.innerHTML='';
 const c1=el('span','tchip',DOW_FULL[s.day]);c1.style.background=acc;tr.appendChild(c1);
 tr.appendChild(el('span','tchip soft','第'+s.p1+(s.p2>s.p1?'-'+s.p2:'')+'节'));
 tr.appendChild(el('span','tchip soft',time));
 document.getElementById('sRoom').textContent=s.room||'未安排';document.getElementById('sTeacher').textContent=s.teacher||'未安排';
 const cls=s.cls||'';const cr=document.getElementById('sClsRow');if(cls){cr.style.display='flex';document.getElementById('sCls').textContent=cls;}else cr.style.display='none';
 document.getElementById('mask').classList.add('show');document.getElementById('sheet').classList.add('show');}
function closeSheet(){document.getElementById('mask').classList.remove('show');document.getElementById('sheet').classList.remove('show');}
renderAll();
</script>
