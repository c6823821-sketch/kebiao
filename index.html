<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f6fa">
<title>我的课表</title>
<style>
:root{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--ink:#14161c;--soft:#5c6270;--faint:#8b91a0;--line:#e7e9f0;--accent:#5856d6;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{background:#f5f6fa;}
body{background:transparent;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",sans-serif;overscroll-behavior:none;}
body{max-width:640px;margin:0 auto;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;user-select:none;font-weight:600;}

#bg,#bgv{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:none;}
#bg{background-size:cover;background-position:center;background-repeat:no-repeat;filter:saturate(1.16) contrast(1.06);}
#bgv{object-fit:cover;}
#scrim{position:fixed;inset:0;z-index:1;pointer-events:none;display:none;background:linear-gradient(180deg,rgba(255,255,255,.66),rgba(255,255,255,.54) 40%,rgba(255,255,255,.6));}
body.bg-on #scrim{display:block;}
.app{position:relative;z-index:2;padding-top:var(--safe-top);padding-bottom:96px;}

.topbar{position:sticky;top:0;z-index:20;background:#fff;display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line);}
body.bg-on .topbar{background:rgba(255,255,255,.42);border-bottom-color:rgba(0,0,0,.06);}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#5856d6,#9b51e0);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;flex:none;box-shadow:0 3px 10px rgba(88,86,214,.35);}
.wk{flex:1;min-width:0;}
.wk-title{font-size:19px;font-weight:800;display:flex;align-items:center;gap:5px;text-shadow:0 1px 2px rgba(255,255,255,.8);}
.wk-title .caret{font-size:12px;color:#7b8290;}
.wk-sub{font-size:10.5px;color:#5c6270;margin-top:2px;font-weight:700;white-space:nowrap;text-shadow:0 1px 2px rgba(255,255,255,.8);}
.navs{display:flex;gap:5px;flex:none;}
.navbtn{width:32px;height:32px;border-radius:10px;background:#f2f3f8;color:#3a3f4a;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.06);}
body.bg-on .navbtn{background:rgba(255,255,255,.72);}
.navbtn:active{background:#e6e8f2;}
.navbtn.today{font-size:12.5px;background:rgba(88,86,214,.14);color:var(--accent);}
.modebadge{font-size:9.5px;font-weight:800;border-radius:6px;padding:2px 6px;margin-left:4px;letter-spacing:.3px;}
.modebadge.app{background:#e3f7ec;color:#0f8a58;}
.modebadge.web{background:#ffe8ec;color:#d02b45;}
.actline{font-size:11px;color:#5856d6;text-align:center;margin-top:6px;font-weight:700;min-height:14px;}
.chipnow{font-size:9.5px;color:#fff;background:var(--accent);border-radius:6px;padding:1px 5px;font-weight:700;}

.pager{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.pager::-webkit-scrollbar{display:none;}
.pager .track{display:flex;align-items:flex-start;}
.page{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;padding:6px 6px 8px;}
.grid{display:grid;grid-template-columns:58px repeat(5,1fr) 22px 22px;
  grid-template-rows:40px 22px 62px 62px 62px 62px 22px 62px 62px 62px 62px 22px 62px 62px;
  background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 5px 20px rgba(20,22,28,.08);}
body.bg-on .grid{background:transparent;box-shadow:none;}
.ghead{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--faint);font-weight:700;border-bottom:1px solid var(--line);}
body.bg-on .ghead{border-bottom-color:transparent;color:#4a5060;text-shadow:0 1px 2px rgba(255,255,255,.85);}
.ghead .lnum{display:inline-flex;min-width:25px;height:25px;border-radius:50%;align-items:center;justify-content:center;font-size:14.5px;font-weight:800;margin-top:1px;color:var(--ink);}
body.bg-on .ghead .lnum{text-shadow:0 1px 2px rgba(255,255,255,.9);}
.ghead.today{color:var(--accent);}
.ghead.today .lnum{background:var(--accent);color:#fff;}
.ghead.wknd{font-size:10px;color:#c3c7d1;}
.ghead.wknd .lnum{font-size:11px;min-width:auto;height:auto;color:#b9bdc8;margin-top:0;}
body.bg-on .ghead.wknd,body.bg-on .ghead.wknd .lnum{color:#8b91a0;}
.sectlabel{display:flex;align-items:center;gap:6px;padding-left:10px;font-size:11.5px;font-weight:800;border-top:1px solid var(--line);}
body.bg-on .sectlabel{border-top-color:rgba(0,0,0,.06);background:rgba(255,255,255,.34);}
.sectlabel.am{background:#eef0ff;color:#5b5bd6;}
.sectlabel.pm{background:#e8f7f4;color:#12a08f;}
.sectlabel.ev{background:#f4edff;color:#8b5cf6;}
.timecell{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;background:#fcfcfe;border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
body.bg-on .timecell{background:transparent;border-right-color:transparent;border-bottom-color:transparent;}
.timecell .pn{font-size:13.5px;font-weight:800;color:var(--ink);white-space:nowrap;line-height:1.1;}
body.bg-on .timecell .pn{text-shadow:0 1px 2px rgba(255,255,255,.9);}
.timecell .pt{font-size:9px;font-weight:700;color:#8a90a0;margin-top:4px;white-space:nowrap;font-variant-numeric:tabular-nums;}
body.bg-on .timecell .pt{color:#4a5060;text-shadow:0 1px 2px rgba(255,255,255,.9);}
.course{position:relative;border-radius:13px;padding:7px 4px;margin:2.5px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;background:#fff;border:1.6px solid var(--acc);overflow:hidden;}
body.bg-on .course{background:transparent;border-width:1.8px;box-shadow:none;}
.course:active{transform:scale(.96);}
.course .cname{font-size:12.5px;font-weight:800;line-height:1.18;color:var(--ink);word-break:break-all;}
body.bg-on .course .cname{text-shadow:0 1px 2px rgba(255,255,255,.95),0 0 7px rgba(255,255,255,.8);}
.course .croom{font-size:9.5px;font-weight:700;line-height:1.2;margin-top:5px;color:var(--soft);word-break:break-all;}
body.bg-on .course .croom{color:#3a3f4a;text-shadow:0 1px 2px rgba(255,255,255,.95),0 0 7px rgba(255,255,255,.8);}
.course .ctype{position:absolute;top:-1px;right:-1px;width:15px;height:15px;border-radius:0 12px 0 8px;background:var(--acc);color:#fff;font-size:8.5px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.bg-none{display:flex;justify-content:center;padding-top:12px;color:#e6e8f0;font-size:16px;font-weight:800;}
body.bg-on .bg-none{color:rgba(0,0,0,.14);}
.noweek{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--faint);gap:8px;}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:12px 8px 2px;font-size:12px;font-weight:700;color:#8a8f9a;justify-content:center;}
body.bg-on .legend{color:#454b59;text-shadow:0 1px 2px rgba(255,255,255,.9);}

.fab{position:fixed;right:16px;bottom:calc(18px + var(--safe-bottom));z-index:30;width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,#5856d6,#9b51e0);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(88,86,214,.45);}
.fab:active{transform:scale(.94);}

.mask{position:fixed;inset:0;background:rgba(15,17,26,.42);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;}
.mask.show{opacity:1;pointer-events:auto;}
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:0 22px;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal.show{opacity:1;pointer-events:auto;}
.mcard{width:100%;max-width:360px;background:#fff;border-radius:22px;padding:22px 20px 20px;box-shadow:0 24px 70px rgba(0,0,0,.32);transform:scale(.94);transition:transform .2s cubic-bezier(.3,1.3,.5,1);position:relative;}body.bg-on .mcard{background:rgba(255,255,255,.58);backdrop-filter:blur(22px) saturate(1.25);-webkit-backdrop-filter:blur(22px) saturate(1.25);border:1px solid rgba(255,255,255,.65);box-shadow:0 22px 70px rgba(10,12,20,.35);}body.bg-on .m-row{border-bottom-color:rgba(0,0,0,.10);}body.bg-on .m-row .k{color:#3f4553;}body.bg-on .m-close{background:rgba(255,255,255,.7);}
.modal.show .mcard{transform:scale(1);}
.m-title{font-size:22px;font-weight:800;line-height:1.3;padding-right:30px;}
.m-close{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;background:#f1f2f6;color:#7c818e;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;}
.m-badge{display:inline-flex;align-items:center;gap:5px;margin-top:12px;font-size:12.5px;font-weight:800;color:#fff;border-radius:9px;padding:5px 11px;}
.m-list{margin-top:16px;border-top:1px solid var(--line);}
.m-row{display:flex;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--line);}
.m-row:last-child{border-bottom:none;}
.m-row .k{width:64px;flex:none;color:var(--faint);font-size:13px;font-weight:700;padding-top:2px;}
.m-row .v{flex:1;color:var(--ink);font-size:15px;font-weight:700;line-height:1.45;}
.m-row .v .sub{display:block;color:var(--soft);font-size:12.5px;font-weight:600;margin-top:2px;}

.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:#fff;z-index:55;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.2);transform:translateY(115%);transition:transform .28s cubic-bezier(.32,.72,.24,1);padding:8px 20px calc(var(--safe-bottom) + 18px);max-height:80vh;overflow:auto;}
.sheet.show{transform:translateY(0);}
.grab{width:40px;height:4px;border-radius:99px;background:#e2e4ec;margin:8px auto 14px;}
.wk-title2{font-size:17px;font-weight:800;text-align:center;padding:0 30px;}
.wk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
.wk-item{border:1.5px solid var(--line);border-radius:12px;padding:11px 6px;text-align:center;}
.wk-item .wno{font-size:15px;font-weight:800;}
.wk-item .wdate{font-size:10.5px;color:var(--soft);margin-top:3px;font-weight:600;}
.wk-item.active{border-color:var(--accent);background:rgba(88,86,214,.08);color:var(--accent);}
.wk-item.now{position:relative;}
.wk-item.now::after{content:"本周";position:absolute;top:5px;right:6px;font-size:9px;background:var(--accent);color:#fff;border-radius:4px;padding:1px 5px;font-weight:700;}

.tabs{display:flex;gap:6px;margin-top:14px;}
.tab{flex:1;text-align:center;padding:9px 0;border-radius:11px;background:#f2f3f8;color:#5c6270;font-size:12.5px;font-weight:800;white-space:nowrap;}
.tab.active{background:var(--accent);color:#fff;}
.bg-item video{width:100%;height:100%;object-fit:cover;display:block;}
.bg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
.bg-item{position:relative;border-radius:13px;overflow:hidden;border:2.5px solid transparent;background:#f2f3f8;aspect-ratio:9/16;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.bg-item img{width:100%;height:100%;object-fit:cover;display:block;}
.bg-item.active{border-color:var(--accent);}
.bg-item .tag{position:absolute;left:0;right:0;bottom:0;font-size:10px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55));padding:14px 6px 5px;text-align:center;}
.bg-item .bgnone{font-size:12px;font-weight:700;color:#7c818e;text-align:center;padding:0 6px;line-height:1.4;}
.bg-item .delx{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(224,72,111,.95);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.notiftip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + var(--safe-bottom));z-index:99;background:#e0486f;color:#fff;font-size:12.5px;font-weight:700;padding:10px 14px;border-radius:12px;display:none;box-shadow:0 6px 20px rgba(224,72,111,.45);}
.rmdtip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + var(--safe-bottom));z-index:99;background:rgba(20,22,28,.86);color:#fff;font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:12px;opacity:0;transition:opacity .35s;pointer-events:none;white-space:nowrap;}
.verline{font-size:11px;color:#8b91a0;text-align:center;margin-top:8px;font-weight:700;}
.dlginput{width:100%;margin-top:14px;border:1.5px solid #e7e9f0;border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit;font-weight:700;color:#14161c;outline:none;}
.dlginput:focus{border-color:#5856d6;}
.dlgbtns{display:flex;gap:10px;margin-top:18px;}
.dlgbtns .btn{flex:1;}
.bghint{grid-column:1/-1;font-size:12px;color:#8b91a0;text-align:center;padding:14px 10px;line-height:1.6;}
.bg-row{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding:12px 2px;border-top:1px solid var(--line);font-size:14px;font-weight:700;}
.btn{border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:800;border-radius:11px;padding:11px 14px;font-family:inherit;}
.btn.ghost{background:#f2f3f8;color:#3a3f4a;}
label.btn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
.filehid{position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0;}
.rngrow{padding:2px 2px 10px;}
.rngrow input[type=range]{-webkit-appearance:none;width:100%;height:26px;background:transparent;}
.rngrow input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,#c9c6ff,#5856d6);}
.rngrow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid #5856d6;margin-top:-8px;box-shadow:0 2px 6px rgba(0,0,0,.2);}
.sw{position:relative;width:46px;height:27px;border-radius:99px;background:#dfe2ea;transition:background .18s;}
.sw.on{background:var(--accent);}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.sw.on::after{left:22px;}
</style>
</head>
<body>
<div id="bg"></div>
<video id="bgv" muted loop playsinline webkit-playsinline></video>
<div id="scrim"></div>

<div class="app">
  <div class="topbar">
    <div class="logo" id="fabBg" title="背景"><svg viewBox="0 0 24 24" width="21" height="21"><path fill="#fff" d="M21 19V5c0-1.1-.9-2-2-2H5c-.9 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z"/></svg></div>
    <div class="wk" id="wkOpen">
      <div class="wk-title"><span id="wkTitle">第 2 周</span><span class="caret">▾</span><span class="chipnow" id="chipnow" style="display:none">本周</span><span class="modebadge web" id="modeBadge">…</span></div>
      <div class="wk-sub" id="wkSub"></div>
    </div>
    <div class="navs">
      <div class="navbtn" id="prevW">‹</div>
      <div class="navbtn today" id="goToday">今</div>
      <div class="navbtn" id="nextW">›</div>
    </div>
  </div>
  <div class="pager" id="pager"><div class="track" id="track"></div></div>
  <div class="legend"><span>◆ 实验</span><span>● 实践</span><span>◇ 上机</span><span>○ 讨论</span><span>★ 讲课</span></div>
</div>


<div class="mask" id="mask2" onclick="closePicker()"></div>
<div class="sheet" id="picker">
  <div class="grab"></div><div class="wk-title2">选择上课周</div><span class="m-close" onclick="closePicker()">✕</span>
  <div class="wk-grid" id="wkGrid"></div>
</div>

<div class="mask" id="mask3" onclick="closeBg()"></div>
<div class="sheet" id="bgSheet">
  <div class="grab"></div><div class="wk-title2">背景</div><span class="m-close" onclick="closeBg()">✕</span>
  <div class="tabs" id="bgTabs"></div>
  <div class="verline" id="verLine"></div>
  <div class="actline" id="actLine"></div>
  <div class="bg-grid" id="bgGrid"></div>
  <div class="bg-row"><span>每次打开随机换一张</span><div class="sw" id="swRand"></div></div>
  <div class="bg-row"><span>用自己的照片 / 视频 / 实况</span><label class="btn" for="fileIn">从相册选</label></div>
  <div class="bg-row"><span>背景浓度（图片清晰度）</span><span id="scrimVal" style="font-weight:800;color:#5856d6;min-width:44px;text-align:right">30%</span></div>
  <div class="rngrow"><input type="range" id="scrimRange" min="0" max="85" step="5" value="30"></div>
  <div class="bg-row"><span>编辑模式（删除不要的图）</span><div class="sw" id="swEdit"></div></div>
  <div class="bg-row"><span>测试上课提醒（立刻弹一条）</span><button class="btn" onclick="nativeSend('testnotif')">测试</button></div>
  <div class="bg-row"><span>恢复默认（无背景）</span><button class="btn ghost" id="btnReset">恢复</button></div>
  <input type="file" id="fileIn" accept="image/*,video/*" class="filehid">
</div>

<div class="mask" id="maskD" onclick="closeDlg()"></div>
<div class="modal" id="dlg" onclick="if(event.target===this)closeDlg()">
  <div class="mcard" style="max-width:330px">
    <div class="m-title" id="dlgTitle" style="font-size:18px"></div>
    <input id="dlgInput" class="dlginput" type="text" style="display:none">
    <div class="dlgbtns"><button class="btn ghost" id="dlgNo" type="button">取消</button><button class="btn" id="dlgYes" type="button">确定</button></div>
  </div>
</div>
<div class="mask" id="mask" onclick="closeModal()"></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="mcard">
    <div class="m-title" id="mTitle"></div>
    <div class="m-close" onclick="closeModal()">✕</div>
    <div class="m-badge" id="mBadge"></div>
    <div class="m-list">
      <div class="m-row"><div class="k">老师</div><div class="v" id="mTeacher"></div></div>
      <div class="m-row"><div class="k">教室</div><div class="v" id="mRoom"></div></div>
      <div class="m-row"><div class="k">周次</div><div class="v" id="mWeeks"></div></div>
      <div class="m-row"><div class="k">时间</div><div class="v" id="mTime"></div></div>
      <div class="m-row" id="mClsRow"><div class="k">班级</div><div class="v" id="mCls"></div></div>
    </div>
  </div>
</div>

<script>
const DAY_NAMES=['一','二','三','四','五','六','日'];
const DOW_FULL=['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];
const PERIODS=[
 {s:'08:10',e:'08:55'},{s:'09:05',e:'09:50'},{s:'10:05',e:'10:50'},{s:'11:00',e:'11:45'},
 {s:'14:40',e:'15:25'},{s:'15:35',e:'16:20'},{s:'16:30',e:'17:15'},{s:'17:25',e:'18:10'},
 {s:'19:10',e:'19:55'},{s:'20:05',e:'20:50'}
];
const SECTIONS=[{name:'上午',first:1,row:2,cls:'am'},{name:'下午',first:5,row:7,cls:'pm'},{name:'晚上',first:9,row:12,cls:'ev'}];
const SEM_START=new Date(2026,7,31);
const SEM_LABEL='2026-2027-1';
const TOTAL_WEEKS=18;
const LEAD_MIN=15;
function rowOf(p){return p<=4?p+2:(p<=8?p+3:p+4);}
const BGS=[
 {id:'none',n:'无背景',cat:'anime'},
 {id:'bg/an1.jpg',n:'樱时',cat:'anime'},{id:'bg/an2.jpg',n:'雨夜霓虹',cat:'anime'},

function accFor(n){if(COLORS[n])return COLORS[n];let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return ['#5856d6','#2f8de0','#12a08f','#e08a1e','#e0486f','#7a5cd8'][h%6];}
function shortRoom(r){return String(r).replace(/[（(][^）)]*[）)]/g,'');}
function splitName(n){const m=n.match(/^(.+?)([★●◆◇○])$/);return m?{title:m[1],type:m[2]}:{title:n,type:''};}
function el(t,c,txt,st){const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;if(st)for(const k in st)e.style[k]=st[k];return e;}
const wc={};
function weeksSet(s){if(wc[s])return wc[s];const set=new Set();if(!s)return set;String(s).split(',').forEach(t=>{t=t.trim();if(!t)return;const i=t.indexOf('-');if(i>=0){const a=+t.slice(0,i),b=+t.slice(i+1);for(let x=a;x<=b;x++)set.add(x);}else set.add(+t);});wc[s]=set;return set;}
function active(s,w){return weeksSet(s.weeks).has(w);}
function fmtWeeks(s){if(!s)return '全部周';return '第'+s.replace(/,/g,'、')+'周';}
function currentWeek(){const n=new Date();const d=new Date(n.getFullYear(),n.getMonth(),n.getDate());let w=Math.floor((d-SEM_START)/6048e5)+1;if(w<1)w=1;if(w>TOTAL_WEEKS)w=TOTAL_WEEKS;return w;}
function weekStart(w){return new Date(SEM_START.getTime()+(w-1)*6048e5);}
function today(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
let curWeek=currentWeek(),selWeek=curWeek;
function coursesForWeek(w){const r=[[],[],[],[],[],[],[]];SCHEDULE.forEach(s=>{if(active(s,w))r[s.day].push(s);});r.forEach(a=>a.sort((x,y)=>x.p1-y.p1||x.p2-y.p2));return r;}

function buildWeekPage(w){
  const page=el('div','page');
  const byDay=coursesForWeek(w);
  const grid=el('div','grid');
  const start=weekStart(w);
  grid.appendChild(el('div','ghead','',{gridColumn:'1',gridRow:'1'}));
  for(let d=0;d<7;d++){
    const dd=new Date(start.getTime()+d*864e5);
    const h=el('div','ghead'+(d>=5?' wknd':''));
    h.style.gridColumn=(d+2)+' / '+(d+3);h.style.gridRow='1';
    const isT=dd.getTime()===today().getTime();if(isT)h.classList.add('today');
    h.innerHTML='<span>'+DAY_NAMES[d]+'</span><span class="lnum">'+dd.getDate()+'</span>';
    grid.appendChild(h);
  }
  SECTIONS.forEach(sec=>{grid.appendChild(el('div','sectlabel '+sec.cls,sec.name,{gridColumn:'1 / 9',gridRow:sec.row}));});
  for(let p=1;p<=10;p++){
    const tc=el('div','timecell');tc.style.gridColumn='1';tc.style.gridRow=rowOf(p);
    tc.innerHTML='<span class="pn">第'+p+'节</span><span class="pt">'+PERIODS[p-1].s+'-'+PERIODS[p-1].e+'</span>';
    grid.appendChild(tc);
  }
  let total=0;
  for(let d=0;d<7;d++){
    const list=byDay[d];
    if(list.length===0){grid.appendChild(el('div','bg-none','·',{gridColumn:(d+2)+' / '+(d+3),gridRow:'2 / 15'}));continue;}
    total+=list.length;
    const laneEnd=[];const placed=list.map(s=>{let li=0;while(true){if(laneEnd[li]===undefined||laneEnd[li]<s.p1){laneEnd[li]=s.p2;break;}li++;}return {s,lane:li};});
    const lanes=laneEnd.length;
    placed.forEach(o=>{
      const s=o.s;const {title,type}=splitName(s.name);const acc=accFor(title);
      const b=el('div','course');b.style.setProperty('--acc',acc);
      const r1=rowOf(s.p1),r2=rowOf(s.p2);
      b.style.gridColumn=(d+2)+' / '+(d+3);b.style.gridRow=r1+' / '+(r2+1);
      if(lanes>1){b.style.height=(100/lanes)+'%';b.style.alignSelf='start';if(o.lane>0)b.style.marginTop=(o.lane*100/lanes)+'%';}
      b.innerHTML='<div class="cname">'+title+'</div>'+(s.room?'<div class="croom">'+shortRoom(s.room)+'</div>':'')+(type?'<div class="ctype">'+type+'</div>':'');
      b.onclick=()=>openModal(s);
      grid.appendChild(b);
    });
  }
  if(total===0){const e=el('div','noweek');e.style.gridColumn='2 / 9';e.style.gridRow='2 / 15';e.innerHTML='<div class="big">🌤</div><div class="txt">这一周没有课</div>';grid.appendChild(e);}
  page.appendChild(grid);return page;
}

let pagesBuilt={};
function pageEl(w){
  const holder=document.getElementById('track').children[w-1];
  if(holder&&!pagesBuilt[w]){ holder.innerHTML=''; holder.appendChild(buildWeekPage(w)); pagesBuilt[w]=true; }
  return holder;
}
function ensureAround(w){ for(let k=w-1;k<=w+1;k++){ if(k>=1&&k<=TOTAL_WEEKS) pageEl(k); } }
function renderAll(){
  const t=document.getElementById('track');t.innerHTML='';pagesBuilt={};
  for(let w=1;w<=TOTAL_WEEKS;w++){ t.appendChild(el('div','page')); }
  ensureAround(selWeek); updateTop(); snapTo(selWeek,false);
}
function updateTop(){
  document.getElementById('wkTitle').textContent='第 '+selWeek+' 周';
  document.getElementById('chipnow').style.display=(selWeek===curWeek)?'inline':'none';
  const st=weekStart(selWeek),en=new Date(st.getTime()+6*864e5);
  const byDay=coursesForWeek(selWeek);let c=0,pp=0;const seen=new Set();
  byDay.forEach(l=>l.forEach(s=>{pp+=(s.p2-s.p1+1);if(!seen.has(s.name)){seen.add(s.name);c++;}}));
  document.getElementById('wkSub').textContent=(st.getMonth()+1)+'.'+st.getDate()+'—'+(en.getMonth()+1)+'.'+en.getDate()+'  ·  本周 '+c+' 门课  ·  共 '+pp+' 节';
}
const pager=document.getElementById('pager');
function snapTo(w,anim){pager.scrollTo({left:(w-1)*pager.clientWidth,behavior:anim?'smooth':'instant'});}
let raf=0;
pager.addEventListener('scroll',()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const w=Math.round(pager.scrollLeft/pager.clientWidth)+1;if(w>=1&&w<=TOTAL_WEEKS&&w!==selWeek){selWeek=w;updateTop();ensureAround(w);}});},{passive:true});
document.getElementById('prevW').onclick=()=>{if(selWeek>1){selWeek--;ensureAround(selWeek);updateTop();snapTo(selWeek,true);}};
document.getElementById('nextW').onclick=()=>{if(selWeek<TOTAL_WEEKS){selWeek++;ensureAround(selWeek);updateTop();snapTo(selWeek,true);}};
document.getElementById('goToday').onclick=()=>{selWeek=curWeek;ensureAround(selWeek);updateTop();snapTo(selWeek,true);};

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('kebiao',1);r.onupgradeneeded=()=>{r.result.createObjectStore('media');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function idbPut(k,v){return idb().then(db=>new Promise(res=>{const t=db.transaction('media','readwrite');t.objectStore('media').put(v,k);t.oncomplete=()=>res();}));}
function idbGet(k){return idb().then(db=>new Promise(res=>{const t=db.transaction('media','readonly');const q=t.objectStore('media').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);})).catch(()=>null);}
function idbDel(k){return idb().then(db=>new Promise(res=>{const t=db.transaction('media','readwrite');t.objectStore('media').delete(k);t.oncomplete=()=>res();})).catch(()=>{});}

function applyBg(id){
  const bg=document.getElementById('bg'),v=document.getElementById('bgv');
  document.body.classList.toggle('bg-on',id!=='none');
  bg.style.display='none';bg.style.backgroundImage='';
  try{v.pause();}catch(e){}
  v.style.display='none';v.removeAttribute('src');
  if(id==='none')return;
  if(id==='custom'){
    idbGet('bg').then(blob=>{
      if(!blob)return;
      const url=URL.createObjectURL(blob);
      if(blob.type&&blob.type.indexOf('video')===0){v.src=url;v.style.display='block';v.loop=true;v.muted=true;v.play().catch(()=>{});}
      else{bg.style.backgroundImage='url("'+url+'")';bg.style.display='block';}
    });
    return;
  }
  if(kindOf(id)==='video'){
    if(id.indexOf('bg/')===0){ v.poster=id.replace(/([^/]+)\.(mp4|webm|mov)$/i,'poster_$1.jpg'); } else { try{v.removeAttribute('poster');}catch(e){} }
    v.src=id;v.style.display='block';v.loop=true;v.muted=true;v.setAttribute('playsinline','');v.play().catch(()=>{});
    return;
  }
  bg.style.backgroundImage='url("'+id+'")';bg.style.display='block';
}

  return true;
}
function pickFromGallery(){ try{ if(window.AndroidBridge&&window.AndroidBridge.pickMedia){ window.AndroidBridge.pickMedia(); return; } }catch(e){} document.getElementById('fileIn').click(); }
function renderBgGrid(){
  const g=document.getElementById('bgGrid');g.innerHTML='';
  const isUser=(bgCat==='my')||(bgCat.indexOf('u:')===0);
  if(isUser){
    const catId=(bgCat.indexOf('u:')===0)?bgCat.slice(2):'my';
    function setAct(s){ var a=document.getElementById('actLine'); if(a)a.textContent=s; }
    const addI=el('div','bg-item');addI.innerHTML='<div class="bgnone">＋ 相册选图片</div>';
    addI.onclick=function(){
      if(nativeSend('pickImage')){ setAct('已调用原生相册接口…'); return; }
      setAct('网页版无法用系统相册'); document.getElementById('fileIn').click();
    };
    g.appendChild(addI);
    const addV=el('div','bg-item');addV.innerHTML='<div class="bgnone">＋ 相册选视频</div>';
    addV.onclick=function(){
      if(nativeSend('pickVideo')){ setAct('已调用原生相册接口…'); return; }
      setAct('网页版无法用系统相册'); document.getElementById('fileIn').click();
    };
    g.appendChild(addV);
    const items=getUserItems().filter(it=>(it.c||'my')===catId);
    items.forEach(it=>{
      const ti=el('div','bg-item'+(selBg===it.u?' active':''));
      ti.innerHTML=(it.k==='video'
        ? '<video src="'+it.u+'" muted loop playsinline autoplay></video>'
        : '<img loading="lazy" decoding="async" src="'+it.u+'">')+'<div class="tag">'+(it.n||'我的')+'</div>';
      if(bgEdit){ const x=el('span','delx','✕'); x.onclick=(ev)=>{ev.stopPropagation();doRemove(it.u);}; ti.appendChild(x); }
      ti.onclick=()=>{ if(bgEdit){doRemove(it.u);return;} selBg=it.u; localStorage.setItem('kb_bg',it.u); activeBg=it.u; applyBg(it.u); renderBgGrid(); closeBg(); };
      g.appendChild(ti);
    });
    if(!items.length) g.appendChild(el('div','bghint','点「＋ 相册选图片 / 视频」加素材；<br>也可以：在图库里选好 → 分享 → 选「我的课表」，直接设为背景'));
    if(bgCat.indexOf('u:')===0){
      const del=el('div','bg-item');del.innerHTML='<div class="bgnone" style="color:#e0486f">删除本分类</div>';
      del.onclick=()=>{ askConfirm('删除这个分类？里面的素材也会一起删掉',()=>{ const cid=bgCat.slice(2);
        setUserItems(getUserItems().filter(it=>(it.c||'my')!==cid));
        setUserCats(getUserCats().filter(c=>c.id!==cid)); bgCat='my'; renderTabs(); renderBgGrid(); }); };
      g.appendChild(del);
    }
    return;
  }
  const hidden=getHidden();
  BGS.filter(b=>(b.cat===bgCat)&&!hidden.includes(b.id)).forEach(b=>{
    const it=el('div','bg-item'+(selBg===b.id?' active':''));
    if(b.id==='none')it.innerHTML='<div class="bgnone">无背景</div>';
    else if(/\.(mp4|webm|mov)$/i.test(b.id)){var po=b.id.replace(/([^/]+)\.(mp4|webm|mov)$/i,'poster_$1.jpg');it.innerHTML='<video src="'+b.id+'" poster="'+po+'" muted loop playsinline preload="none"></video><div class="tag">'+b.n+' ▶</div>';}
    else it.innerHTML='<img loading="lazy" decoding="async" src="'+b.id+'"><div class="tag">'+b.n+'</div>';
    if(bgEdit&&b.id!=='none'){ const x=el('span','delx','✕'); x.onclick=(ev)=>{ev.stopPropagation();const h=getHidden();h.push(b.id);setHidden(h);renderBgGrid();}; it.appendChild(x); }
    it.onclick=()=>{ if(bgEdit){ if(b.id==='none')return; const h=getHidden();h.push(b.id);setHidden(h);renderBgGrid();return;} selBg=b.id; localStorage.setItem('kb_bg',b.id); activeBg=b.id; applyBg(b.id); renderBgGrid(); closeBg(); };
    g.appendChild(it);
  });
  if(bgCat==='anime'){ /* 无背景项已在 BGS 里 */ }
}
function doRemove(u){ askConfirm('删除这张素材？',function(){ setUserItems(getUserItems().filter(it=>it.u!==u)); if(selBg===u){selBg='none';localStorage.setItem('kb_bg','none');applyBg('none');} renderBgGrid(); }); }
window.__onPicked=function(uri,mime,name,kind){
  kind = kind || (((mime||'').indexOf('video')===0)?'video':'image');
  const catId=(bgCat.indexOf('u:')===0)?bgCat.slice(2):'my';
  const arr=getUserItems(); arr.push({u:uri,k:kind,n:(name||'我的'),c:catId}); setUserItems(arr);
  selBg=uri; localStorage.setItem('kb_bg',uri); activeBg=uri; applyBg(uri); closeBg();
};
document.getElementById('fabBg').onclick=openBg;
document.getElementById('swRand').onclick=function(){bgRand=!bgRand;localStorage.setItem('kb_bg_rand',bgRand?'1':'0');this.classList.toggle('on',bgRand);};
document.getElementById('swEdit').onclick=function(){bgEdit=!bgEdit;this.classList.toggle('on',bgEdit);renderBgGrid();};
document.getElementById('btnReset').onclick=()=>{selBg='none';localStorage.setItem('kb_bg','none');activeBg='none';applyBg('none');closeBg();};
document.getElementById('fileIn').onchange=async function(e){
  const f=e.target.files[0]; if(!f) return;
  try{
    if(f.size>8*1024*1024){ alert('文件太大（>8MB）。建议选图片，或用原生相册入口（更稳）。'); }
    const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});
    const kind=(f.type||'').indexOf('video')===0?'video':'image';
    const catId=(bgCat.indexOf('u:')===0)?bgCat.slice(2):'my';
    const arr=getUserItems(); arr.push({u:url,k:kind,n:(f.name||'我的').slice(0,14),c:catId}); setUserItems(arr);
    selBg=url; localStorage.setItem('kb_bg',url); activeBg=url; applyBg(url); closeBg();
  }catch(err){ alert('读取失败，换个文件试试'); }
};
/* ---------- 上课提醒 ---------- */
function showRmdTip(n){
  try{
    var d=document.getElementById('rmdTip');
    if(!d){ d=document.createElement('div'); d.id='rmdTip'; d.className='rmdtip'; document.body.appendChild(d); }
    d.textContent='\u4e0a\u8bfe\u63d0\u9192\u5df2\u8bbe\u7f6e\uff08\u6574\u5b66\u671f \u00b7 \u5171 '+n+' \u8282\uff09';
    d.style.opacity='1';
    clearTimeout(window.__rmdT);
    window.__rmdT=setTimeout(function(){ d.style.opacity='0'; },3200);
  }catch(e){}
}
function pushReminders(){
  try{
    if(!(window.__NATIVE || window.AndroidBridge))return;
    var lines=['SEM|'+SEM_START.getTime()+'|'+TOTAL_WEEKS];
    SCHEDULE.forEach(function(s){
      var tm=PERIODS[s.p1-1].s;
      var nm=splitName(s.name).title.replace(/[|\n]/g,'');
      var rm=shortRoom(s.room).replace(/[|\n]/g,'');
      lines.push([s.day,s.p1,s.p2,s.weeks,nm,rm,tm,PERIODS[s.p2-1].e].join('|'));
    });
    nativeSend('setsched', lines.join('\n'));
    // 兼容旧版 APK：同时发一份"未来10天的具体提醒"
    try{
      var now=Date.now(), list=[];
      for(var w=1;w<=TOTAL_WEEKS;w++){
        var ws=weekStart(w);
        SCHEDULE.forEach(function(s){
          if(!active(s,w))return;
          var dd=new Date(ws.getTime()+s.day*864e5);
          var hm=PERIODS[s.p1-1].s.split(':');
          var st=new Date(dd.getFullYear(),dd.getMonth(),dd.getDate(),+hm[0],+hm[1],0,0).getTime();
          var tt=st-15*60000;
          if(tt>now+30000&&tt<now+10*864e5){
            var sp=splitName(s.name);
            list.push({t:tt,title:'还有 15 分钟上课',body:sp.title+(s.room?' · '+shortRoom(s.room):'')+' · '+PERIODS[s.p1-1].s+' 开始'});
          }
        });
      }
      list.sort(function(x,y){return x.t-y.t;});
      nativeSend('schedule', JSON.stringify(list.slice(0,120)));
    }catch(e){}
  }catch(e){}
}

window.__dismiss=function(){
  const m=document.getElementById('modal'),p=document.getElementById('picker'),b=document.getElementById('bgSheet');
  if(m.classList.contains('show')){closeModal();return 1;}
  if(p.classList.contains('show')){closePicker();return 1;}
  if(b.classList.contains('show')){closeBg();return 1;}
  return 0;
};
let scrimPct=parseInt(localStorage.getItem('kb_scrim')||'30',10);
if(isNaN(scrimPct))scrimPct=30;
function applyScrim(v){scrimPct=v;document.getElementById('scrim').style.opacity=(v/100);localStorage.setItem('kb_scrim',String(v));const sv=document.getElementById('scrimVal');if(sv)sv.textContent=v+'%';const sr=document.getElementById('scrimRange');if(sr)sr.value=v;}
window.addEventListener('load',function(){const sr=document.getElementById('scrimRange');if(sr){sr.value=scrimPct;sr.addEventListener('input',function(){applyScrim(parseInt(this.value,10));});}});
let dlgCb=null;
function openDlg(title,showInput,def,cb){
  dlgCb=cb; const d=document.getElementById('dlg'), inp=document.getElementById('dlgInput');
  document.getElementById('dlgTitle').textContent=title;
  inp.style.display=showInput?'block':'none'; inp.value=def||'';
  d.classList.add('show'); document.getElementById('maskD').classList.add('show');
  if(showInput)setTimeout(function(){try{inp.focus();}catch(e){}},120);
}
function closeDlg(){ document.getElementById('dlg').classList.remove('show'); document.getElementById('maskD').classList.remove('show'); dlgCb=null; }
function askText(title,def,cb){ openDlg(title,true,def,function(ok,val){ if(ok)cb(val); }); }
function askConfirm(title,cb){ openDlg(title,false,'',function(ok){ if(ok)cb(); }); }
document.getElementById('dlgYes').onclick=function(){ const c=dlgCb, v=document.getElementById('dlgInput').value.trim(); closeDlg(); if(c)c(true,v); };
document.getElementById('dlgNo').onclick=function(){ const c=dlgCb; closeDlg(); if(c)c(false,''); };
document.getElementById('dlgInput').addEventListener('keydown',function(e){ if(e.key==='Enter')document.getElementById('dlgYes').click(); });
function setBadge(isApp,v){
  var b=document.getElementById('modeBadge'); if(!b)return;
  b.className='modebadge '+(isApp?'app':'web');
  b.textContent=isApp?('APP '+(v||'')):'网页';
}
function showVer(){
  let v='网页版', pm='', isApp=false;
  try{
    if(window.AndroidBridge&&window.AndroidBridge.version){
      v='App v'+window.AndroidBridge.version(); isApp=true;
      try{ if(window.AndroidBridge.permStatus) pm=' · 相册权限：'+window.AndroidBridge.permStatus(); }catch(e){}
    }
  }catch(e){}
  if(!isApp && window.__NATIVE){ v='App v'+(window.__NATIVE_VERSION||''); isApp=true; pm=' · 选图请用右下角「相册」按钮'; }
  const el2=document.getElementById('verLine');
  if(el2) el2.textContent='当前版本：'+v+(v==='网页版'?'（网页版无法调用相册，请装 APK）':pm);
  setBadge(isApp, isApp?window.AndroidBridge.version():'');
}
window.addEventListener('load',showVer);
function kickVideo(){ try{ var v=document.getElementById('bgv'); if(v&&v.style.display!=='none'&&v.paused){ v.play().catch(function(){}); } }catch(e){} }
document.addEventListener('touchstart',kickVideo,{passive:true});
document.addEventListener('click',kickVideo);
renderAll();
applyBg(activeBg);
applyScrim(scrimPct);
showVer();
setTimeout(pushReminders,2500);
setTimeout(function(){
  try{
    if(window.__NATIVE && window.__NOTIF===false){
      var d=document.getElementById('notifTip');
      if(!d){ d=document.createElement('div'); d.id='notifTip'; d.className='notiftip'; d.textContent='⚠ 通知没打开，点这里去开启（不然收不到上课提醒）'; d.onclick=function(){ nativeSend('notifsettings'); }; document.body.appendChild(d); }
      d.style.display='block';
    }
  }catch(e){}
},3000);
document.addEventListener('touchstart',function __r(){ pushReminders(); document.removeEventListener('touchstart',__r); },{passive:true});
